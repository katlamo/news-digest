name: Daily news digest

on:
  schedule:
    # 08:17 UTC = 10:17 Prague in summer, 09:17 UTC = 10:17 Prague in winter; the gate step keeps the right one
    - cron: "17 8 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:   # manual "Run workflow" button for testing

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check Prague time
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Decide by WHICH cron fired, not by the clock: GitHub often starts scheduled
          # runs 30-60+ min late, which would push the run past 10:59 Prague and skip it.
          OFFSET=$(TZ=Europe/Prague date +%z)   # +0100 in winter, +0200 in summer
          if [ "$OFFSET" = "+0200" ]; then WANTED="17 8 * * *"; else WANTED="17 9 * * *"; fi
          echo "Event: $GITHUB_EVENT_NAME | cron: '$SCHEDULE' | wanted: '$WANTED'"
          echo "Now: $(date -u +%H:%M) UTC / $(TZ=Europe/Prague date +%H:%M) Prague ($OFFSET)"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" != "$WANTED" ]; then
            echo "This cron is not the 10:xx-Prague one for the current DST offset - skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - run: pip install feedparser
        if: steps.gate.outputs.run == 'true'
      - run: python fetch_news.py
        if: steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Show the digest on the run summary page
        if: always() && steps.gate.outputs.run == 'true'
        run: cat digest.md >> "$GITHUB_STEP_SUMMARY" || true
